  T4.4:
    name: 'Daemon is stateless between restarts: pushes per-wrapper state blobs to each wrapper on change, reassembles its world from reconnecting wrappers, and migrates older blob schemas forward.'
    status: achieved
    value: 0.0
    cost: 0.0
    showcase: true
    actual_cost: 0.0
    acceptance:
    - The daemon carries no persistent state file. All per-wrapper state lives in memory during its lifetime and is pushed to the owning wrapper (via `set_state`) whenever it changes meaningfully — e.g. after capturing an MCP-Session-Id, after a completed reload, after a version-seen update.
    - On daemon startup, no wrappers are assumed to exist. Wrappers reconnect and send snapshots; the daemon assembles its view lazily from those snapshots. Wrappers that never reconnect are forgotten without consequence.
    - 'The state blob is version-tagged with a `schema_version` integer. The daemon maintains a versioned migration pipeline: for any older schema version it encounters, it chains migrations up to the current version before use.'
    - A migration regression test fixes a blob captured from each released daemon version on disk, loads it through the current daemon's migration pipeline, and asserts the result is semantically equivalent to what today's daemon would have produced from scratch.
    - 'Daemon restart across version boundaries (old daemon schema v1 → new daemon schema v2) is demonstrated in an e2e test: old daemon persists a blob to the wrapper, gets replaced by a new daemon, new daemon reads the blob, migrates, and continues operation without requiring an agent-side restart.'
    - Unexpected daemon crash (SIGKILL, panic) is treated identically to a clean restart from the wrapper's perspective — the daemon re-reads its world from snapshots + blobs with no need for a shutdown hook.
    context: |-
      Fourth sub-target of 🎯T4. Depends on T4.3 (needs the daemon to own enough state for the blob to be meaningful). This sub-target locks in the invariant that makes T4 worthwhile at all: the daemon is a reconcile-from-observation controller with no persistent memory. It also makes the wrapper's custody role concrete \u2014 not just for its own operational state, but for state the daemon hands it for safekeeping.

      User framing (2026-04-21): "Upgrading state in the event of a daemon upgrade that uses a new schema would be entirely the daemon's concern. The T-piece would only concern itself with holding onto it while the daemon upgrades. The daemon should also push state changes to the T-piece regularly in the event of an unexpected restart."
    depends_on:
    - T4.3
    tags:
    - daemon
    - state
    - schema-migration
    origin: manual
    discovered: 2026-04-21
    achieved: 2026-04-22
