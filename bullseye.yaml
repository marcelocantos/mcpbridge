      The v1 config file describes only how the daemon should poll for upgrades. v2 extends it to also describe how to connect to the wrapped server, so the same file is the single source of truth for both wrapper (connection details) and daemon (upgrade source).

      Schema v2 envelope:

          { "schema": 2,
            "name": "mnemo",
            "command": "/opt/homebrew/bin/mnemo",   // stdio backend
            "args": [],                              //   "
            // — OR —
            "url": "http://localhost:19419/mcp",    // http backend
            "source": { "type": "brew", ... },       // upgrade source (unchanged)
            "upgrade": "auto", "check_interval": "30m" }

      Validation: exactly one of {command, url} must be present. URL constraints inherit from v1's --url backend (plain http:// to loopback hosts only). The `name` field stays as the identifier shared with the daemon for reload routing — no longer constrained to match the filename.

      No backward-compat with v1 (pre-1.0; release notes document the migration).
