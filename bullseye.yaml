    name: Config schema v2 carries connection metadata alongside upgrade metadata
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - daemon/internal/config parses schema:2 files with connection fields
    - 'Validation rejects: schema!=2, both command+url, neither command+url, url with non-loopback host, url with https://'
    - Existing v1 config-related tests rewritten or replaced; v1 schema explicitly rejected with a migration message
    - docs/config-schema.md rewritten for v2 (under 🎯T5.4 it gets cross-doc updates; this leaf delivers the schema doc itself)
