    - 'State blob: on every `set_state { blob, schema_version }` instruction the wrapper stores the blob atomically, overwriting any prior value. On reconnect, the wrapper returns the blob verbatim in its snapshot.'
    - 'Daemon-absent fallback: if argv contains `-- CMD ARGS...` and the daemon is unreachable, the wrapper falls back to today''s stdio behaviour (fork/exec + two streams between agent stdio and child stdio) and exits on agent EOF. HTTP fallback is explicitly unsupported.'
