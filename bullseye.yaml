  T5:
    name: Agent reaches every wrapped MCP server through a uniform `mcpbridge connect &lt;name&gt;` front door, regardless of backend transport
    status: achieved
    value: 0.0
    cost: 0.0
    showcase: true
    demonstration: 'Confirmed via `make test` — full suite passes (smoke, mcp, fsm, transport_stdio, transport_http, dispatch, daemon_client; e2e_wrapper, e2e_reload, e2e_http_reload all green) under the new unified front door. Verified the help text by hand: `./wrapper/mcpbridge --help` shows only `connect <path>`, and `./wrapper/mcpbridge --url http://x` prints the migration message and exits 2. Wrapper bridges both stdio (e2e_reload, fake_mcp child) and HTTP (e2e_http_reload, fake_http_mcp upstream) backends through the same `mcpbridge connect <config.json>` invocation; switching backends is a config-file edit, not a client-config edit.'
    acceptance:
    - 'The agent''s MCP client config form is identical across stdio and HTTP backends: `mcpbridge connect <name>` (or equivalent JSON `command`+`args` shape).'
    - Switching a server's backend type (stdio↔HTTP) requires only an edit to the daemon-side config; the agent's MCP client config does not change.
    - Existing v0.3.0 stdio invocations (`mcpbridge -- COMMAND`) and HTTP invocations (`mcpbridge --url ... --config NAME`) are removed; the wrapper rejects them with a migration message.
    - The wrapper still works when the daemon is down (it reads the same config files the daemon does for connection lookup; loses only upgrade signaling).
    - 'End-to-end tests cover both transports through the new front door: stdio child cycle on reload; HTTP backend cycle on reload.'
    - All v0.3.0 documentation is rewritten to use the new form.
    context: |-
      v0.3.0 ships two distinct agent-config shapes — `mcpbridge -- COMMAND` for stdio backends, `mcpbridge --url URL --config NAME` for HTTP backends. A backend-transport change in the wrapped server (e.g., mnemo went stdio→HTTP at v0.20.0) forces the user to rewrite the agent's MCP client config. That's the wrong axis of variability: agents should care about **identity** (which server am I talking to), not **transport** (how is it currently implemented).

      The unified front door collapses both forms to a single shape:

          mcpbridge connect <name>

      mcpbridge looks up `<name>` in a config file that holds the connection details (command+args for stdio, url for HTTP) plus the upgrade metadata it already carries. Backend-transport changes become a daemon-side config edit; the agent's MCP client config never moves. The wrapper continues to bridge stdio↔stdio or stdio↔HTTP per backend type, so the agent always sees a stdio MCP server.

      Daemon role is unchanged: UDS-only, upgrade polling, reload signals. No HTTP listener — that experiment (briefly explored earlier this session) is superseded.

      This is a breaking change to v0.3.0's CLI. Pre-1.0; permitted. Migration notes go in release notes.
    origin: design discussion 2026-04-25 (supersedes earlier T5 attempt)
    discovered: 2026-04-25
    achieved: 2026-04-25
