name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false

      - name: Environment
        run: |
          cc --version
          go version
          uname -a

      # Same recipe the local pre-push hook runs (scripts/hooks/pre-push),
      # so CI is a second-platform regression net rather than a different
      # set of checks.
      - name: Gate
        run: make gate
