name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Environment
        run: |
          cc --version
          go version
          uname -a

      - name: Build
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          # Strip the leading v to match Homebrew and semver conventions.
          RAW_VERSION="${VERSION#v}"
          make VERSION="$RAW_VERSION"

      - name: Test
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          RAW_VERSION="${VERSION#v}"
          make test VERSION="$RAW_VERSION"

      - name: Package
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          RAW_VERSION="${VERSION#v}"
          STAGE="mcpbridge-${RAW_VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp wrapper/mcpbridge daemon/mcpbridge-daemon "$STAGE/"
          cp LICENSE NOTICES.md README.md agents-guide.md "$STAGE/" 2>/dev/null || true
          mkdir -p "$STAGE/docs"
          cp docs/wire-protocol.md docs/config-schema.md docs/packaging.md \
             "$STAGE/docs/" 2>/dev/null || true
          tar czf "$STAGE.tar.gz" "$STAGE"
          ls -la "$STAGE.tar.gz"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          RAW_VERSION="${VERSION#v}"
          STAGE="mcpbridge-${RAW_VERSION}-${{ matrix.target }}"
          gh release upload "$VERSION" "$STAGE.tar.gz" --clobber

  homebrew:
    name: publish homebrew formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release to Homebrew tap
        uses: Justintime50/homebrew-releaser@v3
        with:
          homebrew_owner: marcelocantos
          homebrew_tap: homebrew-tap
          formula_folder: Formula
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          version: ${{ github.event.release.tag_name }}
          # Install: both binaries from the extracted tarball.
          install: |
            bin.install "mcpbridge"
            bin.install "mcpbridge-daemon"
          # Run as a background service via brew services.
          formula_includes: |
            service do
              run [opt_bin/"mcpbridge-daemon"]
              keep_alive true
              log_path var/"log/mcpbridge-daemon.log"
              error_log_path var/"log/mcpbridge-daemon.log"
            end
          target_darwin_arm64: true
          target_linux_amd64: true
          target_linux_arm64: true
          test: |
            system "#{bin}/mcpbridge", "--version"
            system "#{bin}/mcpbridge-daemon", "--version"
          skip_checksum: true
          update_readme_table: true
