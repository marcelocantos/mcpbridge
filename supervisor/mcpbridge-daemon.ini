; User-local mcpbridge reload daemon (Unix socket, no TCP port).
; supervisor/install.sh expands @REPO@ into the checkout path.

[program:mcpbridge-daemon]
command=@REPO@/supervisor/run-mcpbridge-daemon.sh
directory=@REPO@
environment=HOME="%(ENV_HOME)s",USER="%(ENV_USER)s",PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:%(ENV_HOME)s/.cargo/bin:%(ENV_HOME)s/.local/bin:%(ENV_HOME)s/.py/bin:%(ENV_HOME)s/go/bin:/usr/bin:/bin:/usr/sbin:/sbin"
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=%(ENV_HOME)s/.local/var/log/mcpbridge-daemon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
